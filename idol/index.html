<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【地下アイドル】チェキ狂い度チェッカー</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161b26;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
            --accent-pink: #ff2a85;
            --accent-cyan: #00f0ff;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            overflow-x: hidden;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }
        h1 {
            font-size: 1.15rem;
            text-align: center;
            margin-bottom: 24px;
            background: linear-gradient(45deg, var(--accent-pink), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .question-box {
            margin-bottom: 20px;
        }
        .progress {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 8px;
            text-align: right;
            font-weight: bold;
        }
        .question-title {
            font-size: 1rem;
            margin-bottom: 16px;
            line-height: 1.5;
            font-weight: bold;
        }
        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .choice-btn {
            background-color: #21262d;
            color: var(--text-main);
            border: 1px solid #30363d;
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }
        .choice-btn:hover, .choice-btn:focus, .choice-btn:active {
            border-color: var(--accent-pink);
            background-color: #30363d;
            outline: none;
        }

        /* --- ホワイトアウト演出 --- */
        #gacha-animation-screen {
            display: none;
            height: 350px;
            position: relative;
            background: radial-gradient(circle, #161b26 0%, #04060b 100%);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #30363d;
            justify-content: center;
            align-items: center;
        }
        .cave-light-source {
            width: 40px;
            height: 40px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 50px 30px #fff, 0 0 100px 60px var(--accent-cyan), 0 0 150px 90px var(--accent-pink);
            animation: caveExpand 1.1s cubic-bezier(0.77, 0, 0.175, 1) forwards;
        }
        @keyframes caveExpand {
            0% { transform: scale(0.1); opacity: 0.2; }
            50% { transform: scale(3); opacity: 0.8; }
            100% { transform: scale(25); opacity: 1; background: #ffffff; }
        }

        /* --- ガチャカード結果画面 --- */
        #result-screen {
            display: none;
            text-align: center;
        }
        .gacha-card {
            border-radius: 12px;
            overflow: hidden;
            padding: 5px;
            margin-bottom: 16px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            transform: scale(0.6);
            opacity: 0;
            animation: cardZoomIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes cardZoomIn {
            0% { transform: scale(0.6) translateY(40px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .gacha-card.sss {
            background: linear-gradient(135deg, #ff007f, #7f00ff, #00f0ff, #ffdf00, #ff007f);
            background-size: 400% 400%;
            animation: rainbowBorder 3s linear infinite, cardZoomIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.8), inset 0 0 15px rgba(255, 255, 255, 0.5);
        }
        @keyframes rainbowBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .gacha-card.sr { background: linear-gradient(135deg, #ff2a85, #ff758c, #ff7eb3); box-shadow: 0 0 20px rgba(255, 42, 133, 0.4); }
        .gacha-card.r { background: linear-gradient(135deg, #00f0ff, #0077ff); box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }
        .gacha-card.n { background: #30363d; }

        .card-inner {
            background-color: #161b26;
            border-radius: 9px;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }
        .rarity-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 4px 12px;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 4px;
            color: #fff;
            z-index: 3;
            letter-spacing: 1px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .sss .rarity-badge { background: linear-gradient(135deg, #ff007f, #7f00ff); }
        .sr .rarity-badge { background: linear-gradient(135deg, #ff2a85, #ff758c); }
        .r .rarity-badge { background: linear-gradient(135deg, #00f0ff, #0077ff); color: #000; }
        .n .rarity-badge { background: #484f58; }

        .card-inner img {
            width: 100%;
            height: auto;
            display: block;
        }
        .rank-title {
            font-size: 1.4rem;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .sss-text { color: #ff007f; text-shadow: 0 0 10px rgba(255, 0, 127, 0.4); }
        .sr-text { color: #ff758c; }
        .r-text { color: #00f0ff; }
        .n-text { color: #8b949e; }
        .rank-desc {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 20px;
            line-height: 1.6;
            text-align: left;
            background: #21262d;
            padding: 14px;
            border-radius: 8px;
        }
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .share-btn {
            background-color: #000;
            color: #fff;
            border: 1px solid #333;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
        }
        .share-btn:hover { background-color: #222; }
        .sub-btn-group {
            display: flex;
            gap: 10px;
        }
        .sub-btn {
            flex: 1;
            background-color: #21262d;
            color: var(--text-main);
            border: 1px solid #30363d;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            text-decoration: none;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }
        .sub-btn:hover { background-color: #30363d; border-color: #8b949e; }
        .svg-icon { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>【地下アイドル】チェキ狂い度チェッカー</h1>

        <div id="quiz-screen">
            <div id="progress" class="progress">Q1 / 4</div>
            <div class="question-box">
                <div id="question-text" class="question-title">読み込み中...</div>
                <div id="choices-container" class="btn-list"></div>
            </div>
        </div>

        <div id="gacha-animation-screen">
            <div class="cave-light-source"></div>
        </div>

        <div id="result-screen">
            <div id="gacha-card-frame" class="gacha-card">
                <div class="card-inner">
                    <div id="rarity-badge" class="rarity-badge">SSS</div>
                    <img src="" alt="診断結果画像" id="result-image">
                </div>
            </div>

            <div class="rank-title" id="rank-title">称号読み込み中...</div>
            <div class="rank-desc" id="rank-desc">ここに診断結果の詳細テキストが入ります。</div>

            <div class="action-buttons">
                <button class="share-btn" onclick="shareToX()">𝕏 で結果をシェアする</button>
                <div class="sub-btn-group">
                    <button class="sub-btn" onclick="retryQuiz()">
                        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
                        もう一度診断
                    </button>
                    <a href="../index.html" class="sub-btn">
                        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                        トップに戻る
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const imagePaths = ["img/sss.webp", "img/sr.webp", "img/r.webp", "img/n.webp"];
                imagePaths.forEach(path => {
                const img = new Image();
                img.src = path;
        });
        const questions = [
            {
                text: "Q1. 今月のチェキ代、正直いくら使った？",
                choices: [
                    { text: "10万円以上（破産寸前・生活費が消えた）", score: 5 },
                    { text: "5〜9万円（計画的破産・ギリギリのライン）", score: 4 },
                    { text: "1〜4万円（お小遣いの範囲内でやりくり）", score: 2 },
                    { text: "数千円程度・または今月は一切なし", score: 1 }
                ]
            },
            {
                text: "Q2. 推しのライブ・イベントへの参加率は？",
                choices: [
                    { text: "全通（地方遠征・平日の対バンもすべて網羅）", score: 5 },
                    { text: "主要なワンマンや土日の主催ライブはほぼ参加", score: 4 },
                    { text: "気が向いた時や休みの日にフラッと顔を出す", score: 2 },
                    { text: "基本は在宅・配信やSNSを眺めるのみ", score: 1 }
                ]
            },
            {
                text: "Q3. 特典会での会話やチェキを見返す頻度は？",
                choices: [
                    { text: "毎日全枚数を見返し、SNSの布教用アカウントも完備", score: 5 },
                    { text: "週末やライブの余韻に浸りたい時にアルバムを開く", score: 4 },
                    { text: "気が向いた時に時々眺めるくらい", score: 2 },
                    { text: "ほとんど見返さない・財布や箱に入れっぱなし", score: 1 }
                ]
            },
            {
                text: "Q4. ライブ中の現場での自分の立ち回りは？",
                choices: [
                    { text: "最前管理・推しメンからの認知がすべての生きがい", score: 5 },
                    { text: "周りのオタクと一体になって元気に盛り上がる", score: 4 },
                    { text: "自分のペースで程よくフリコピやコールを楽しむ", score: 3 },
                    { text: "一人で静かに後方・ドリンクカウンターで見守る", score: 1 }
                ]
            }
        ];

        let currentIdx = 0;
        let totalScore = 0;

        function loadQuestion() {
            if (currentIdx >= questions.length) {
                triggerWhiteoutAnimation();
                return;
            }
            document.getElementById("progress").innerText = `Q${currentIdx + 1} / ${questions.length}`;
            const q = questions[currentIdx];
            document.getElementById("question-text").innerText = q.text;
            const container = document.getElementById("choices-container");
            container.innerHTML = "";

            q.choices.forEach(choice => {
                const btn = document.createElement("button");
                btn.className = "choice-btn";
                btn.innerText = choice.text;
                btn.onclick = () => {
                    totalScore += choice.score;
                    currentIdx++;
                    loadQuestion();
                };
                container.appendChild(btn);
            });
        }

        function triggerWhiteoutAnimation() {
            document.getElementById("quiz-screen").style.display = "none";
            const animScreen = document.getElementById("gacha-animation-screen");
            animScreen.style.display = "flex";
            setTimeout(() => {
                animScreen.style.display = "none";
                showResult();
            }, 1100);
        }

        function showResult() {
            document.getElementById("result-screen").style.display = "block";
            let title = "", desc = "", rarityClass = "", badgeText = "", imagePath = "", titleColorClass = "";

            if (totalScore >= 18) {
                title = "【最前管理プロチェキ狂】";
                desc = "現場の狂気。あなたの財布と熱量はもはや伝説であり、推しメンにとっての最大の脅威にして最大の支えです。";
                rarityClass = "sss"; badgeText = "SSS"; imagePath = "img/sss.webp"; titleColorClass = "sss-text";
            } else if (totalScore >= 13) {
                title = "【全通ハイパー常連】";
                desc = "現場の勝ち組。最前フェンスの主として、推しメンからの信頼と認知を完全に勝ち取っているリッチな常連です。";
                rarityClass = "sr"; badgeText = "SR"; imagePath = "img/sr.webp"; titleColorClass = "sr-text";
            } else if (totalScore >= 8) {
                title = "【エンジョイ通い勢】";
                desc = "等身大のオタク像。中後方からマイペースにペンライトを揺らし、ライブの雰囲気を心から楽しんでいる健全層です。";
                rarityClass = "r"; badgeText = "R"; imagePath = "img/r.webp"; titleColorClass = "r-text";
            } else {
                title = "【一般通過ライト新規】";
                desc = "ドリンクカウンターの隅っこ。もらった1枚のチェキを片手に、未知の世界に戸惑いつつも新鮮に楽しんでいる初心者さんです。";
                rarityClass = "n"; badgeText = "N"; imagePath = "img/n.webp"; titleColorClass = "n-text";
            }

            const cardFrame = document.getElementById("gacha-card-frame");
            cardFrame.className = `gacha-card ${rarityClass}`;
            document.getElementById("rarity-badge").innerText = badgeText;
            document.getElementById("result-image").src = imagePath;
            const titleEl = document.getElementById("rank-title");
            titleEl.innerText = title;
            titleEl.className = `rank-title ${titleColorClass}`;
            document.getElementById("rank-desc").innerText = desc;
        }

        function shareToX() {
            const rankTitle = document.getElementById("rank-title").innerText;
            const text = encodeURIComponent(`私の地下アイドル・チェキ狂い度診断の結果は${rankTitle}でした！\n#地下アイドルチェキ狂い度チェッカー`);
            window.open(`https://twitter.com/intent/tweet?text=${text}`, '_blank');
        }

        function retryQuiz() {
            currentIdx = 0; totalScore = 0;
            document.getElementById("result-screen").style.display = "none";
            document.getElementById("quiz-screen").style.display = "block";
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
